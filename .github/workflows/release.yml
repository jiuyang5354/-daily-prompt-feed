name: publish daily release
on:
  push:
    branches: [drop]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drop
      - name: Create release from drop branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          D=$(jq -r .date manifest.json)
          ISSUE=$(jq -r .issue manifest.json)
          TITLE=$(jq -r .title manifest.json)
          TAG="dp-$D"
          echo "$(jq -r .sha256 manifest.json)  final.mp4" | sha256sum -c -
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" final.mp4 cover.jpg manifest.json \
            --target main \
            --title "Daily Prompt No.$ISSUE · $D" \
            --notes "$TITLE"
      - name: Keep only last 14 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[14:] | .[].tagName' | while read t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
